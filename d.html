<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Tahoma, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f6f9;
      color: #222;
    }
    .card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { margin: 0 0 10px; }
    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>مرحباً بك 🎉</h1>
    <p>موقعي يعمل بنجاح</p>
    <p class="note">نقوم بتسجيل بيانات الزيارة (مثل وقت الدخول والموقع التقريبي) لأغراض إحصائية.</p>
  </div>

  <script>
    async function logVisit() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const info = await res.json();
        const data = {
          time: new Date().toLocaleString('ar-SA'),
          ip: info.ip || '',
          city: info.city || '',
          country: info.country_name || '',
          device: navigator.userAgent,
          language: navigator.language,
          screen: screen.width + 'x' + screen.height,
          referrer: document.referrer || 'مباشر'
        };
        fetch('https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTk2OOERH5L661daedcsSYyVgfW6vdAutoHkTgAzg0S1_0Jg1glLftb1ZydjMDa4mwhwYP2qha0J8MRiaQRR_P2IylEzwEYq_-a-bUWC-dWq07Ztmu946orbAnKfXoKMi8vN3J_WQuXQf5DcBHSBfYGpS6ofVGkm6wjcyYr3_0WrLujqGAA0F3LFRU4eQFFN8SfMdXk8vqK59iTQeEqig9E8G6eHpLDKgX5DbuCtTyw4zKelg07v9R2WXct-2tyoNhBvy_irzCyW4Ejr3qKupAOgsQ0zQ&lib=MOAFvkAjIl_o1BartCOftT0MJMbliQF9L', {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(data)
        });
      } catch (e) {
        console.error('تعذّر تسجيل الزيارة:', e);
      }
    }
    logVisit();
  </script>
</body>
</html>
