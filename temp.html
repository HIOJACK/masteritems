<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>درجة حرارة الشهر</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cairo&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: "Amiri", "Cairo", "Tahoma", "Arial", sans-serif;
            direction: rtl;
            margin: 0;
            background: #fff;
        }
        .a4 {
            width: 190mm;
            min-height: 200mm;
            margin: auto;
            padding: 3mm;
            border: 2px solid #000;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            width: 70px;
        }
        h2 {
            text-align: center;
            margin: 10px 0 5px;
            font-size: 15px;
        }
        .department {
            font-weight: bold;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            border: 2px solid #000;
            padding: 3px 4px;
            text-align: center;
        }
        th {
            background-color: #e0e0e0;
        }
        #selected-dept {
            display: inline-block;
            min-width: 150px;
        }
        @media print {
            select {
                display: none;
            }
            #selected-dept::before {
                content: attr(data-value);
            }
        }
    </style>
</head>
<body>

<div class="a4">
    <div class="header">
        <div class="department">
            القسم:
<select onchange="updateDept(this)" style="font-size:11px; font-family:inherit;">
    <option>الصيدلية</option>
    <option>ثلاجة الصيدلية</option>
    <option>مستودع الأدوية</option>
    <option>ثلاجة الأدوية 1</option>
    <option>ثلاجة الأدوية 2</option>
    <option>مستودع الملزمة</option>
    <option>مستودع المختبر</option>
    <option>..............</option>
</select>
<span id="selected-dept" data-value="الصيدلية"></span>
 </div>
        <img src="AIWA.png" class="logo" alt="Logo">
    </div>

    <h2>درجة حرارة شهر (<span id="month-name"></span>)</h2>

    <table>
        <thead>
            <tr>
                <th>اليوم</th>
                <th>التاريخ</th>
                <th>درجة الحرارة</th>
                <th>الاسم</th>
                <th>التوقيع</th>
            </tr>
        </thead>
        <tbody id="days-body">
            <!-- يتم توليد الصفوف عبر JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // أسماء الأشهر بالعربية (0 = يناير ... 11 = ديسمبر)
    const months = [
        'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
        'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
    ];
    // أسماء الأيام بالعربية (0 = الأحد ... 6 = السبت)
    const daysArabic = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    const now = new Date();
    const monthNumber = now.getMonth() + 1; // 1 - 12
    const year = now.getFullYear();
    const monthName = months[now.getMonth()];

    // عدد أيام الشهر الحالي
    const daysInMonth = new Date(year, monthNumber, 0).getDate();

    // عرض اسم الشهر في العنوان
    document.getElementById('month-name').textContent = monthName;
    document.title = 'درجة حرارة شهر ' + monthName;

    // توليد صفوف الجدول
    const tbody = document.getElementById('days-body');
    for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, monthNumber - 1, day);
        const dayName = daysArabic[dateObj.getDay()];

        const row = document.createElement('tr');
        row.innerHTML =
            '<td>' + dayName + '</td>' +
            '<td>' + day + ' / ' + monthNumber + ' / ' + year + '</td>' +
            '<td></td>' +
            '<td></td>' +
            '<td></td>';
        tbody.appendChild(row);
    }

    function updateDept(select) {
        const deptSpan = document.getElementById("selected-dept");
        deptSpan.setAttribute("data-value", select.value);
    }
</script>

</body>
</html>
